name: Build & Deploy Frontend to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PORT_RAW: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_HOST_RAW: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER_RAW: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          SSH_HOST=$(echo -n "$SSH_HOST_RAW" | tr -d '\r\n ')
          SSH_USER=$(echo -n "$SSH_USER_RAW" | tr -d '\r\n ')
          SSH_PORT=$(echo -n "$SSH_PORT_RAW" | tr -d '\r\n ')
          SSH_PORT=${SSH_PORT:-22}
          
          cat << EOF > ~/.ssh/config
          Host cpanel
              HostName ${SSH_HOST}
              User ${SSH_USER}
              Port ${SSH_PORT}
              IdentityFile ~/.ssh/id_rsa
              IdentitiesOnly yes
              StrictHostKeyChecking no
              PubkeyAcceptedKeyTypes +ssh-rsa
              HostKeyAlgorithms +ssh-rsa
              ServerAliveInterval 30
              ServerAliveCountMax 3
              ControlMaster auto
              ControlPath ~/.ssh/control-%h-%p-%r
              ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Package & Transfer to cPanel
        env:
          DEST_PATH_RAW: ${{ secrets.CPANEL_FRONTEND_PATH }}
        run: |
          DEST_PATH=$(echo -n "$DEST_PATH_RAW" | tr -d '\r\n ')

          # 1. Package dist output
          tar -czf /tmp/frontend-deploy.tar.gz -C dist .

          # 2. Ensure remote directory exists
          echo "Ensuring remote directory exists: ${DEST_PATH}"
          ssh cpanel "mkdir -p ${DEST_PATH}"

          # 3. Upload archive
          echo "Uploading frontend archive..."
          scp /tmp/frontend-deploy.tar.gz cpanel:${DEST_PATH}/frontend-deploy.tar.gz

          # 4. Extract archive on server
          echo "Extracting frontend archive..."
          ssh cpanel "cd ${DEST_PATH} && tar -xzf frontend-deploy.tar.gz && rm -f frontend-deploy.tar.gz"
