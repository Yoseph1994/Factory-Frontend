name: Build & Deploy Frontend to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PORT_RAW: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_HOST_RAW: ${{ secrets.CPANEL_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          SSH_HOST=$(echo -n "$SSH_HOST_RAW" | tr -d '\r\n ')
          SSH_PORT=$(echo -n "$SSH_PORT_RAW" | tr -d '\r\n ')
          SSH_PORT=${SSH_PORT:-22}
          
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy Built Assets to cPanel (Streaming Tar)
        env:
          SSH_HOST_RAW: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER_RAW: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT_RAW: ${{ secrets.CPANEL_SSH_PORT }}
          DEST_PATH_RAW: ${{ secrets.CPANEL_FRONTEND_PATH }}
        run: |
          SSH_HOST=$(echo -n "$SSH_HOST_RAW" | tr -d '\r\n ')
          SSH_USER=$(echo -n "$SSH_USER_RAW" | tr -d '\r\n ')
          SSH_PORT=$(echo -n "$SSH_PORT_RAW" | tr -d '\r\n ')
          SSH_PORT=${SSH_PORT:-22}
          DEST_PATH=$(echo -n "$DEST_PATH_RAW" | tr -d '\r\n ')

          tar -czf - -C dist . | ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa "${SSH_USER}@${SSH_HOST}" "mkdir -p ${DEST_PATH} && tar -xzf - -C ${DEST_PATH}"
